<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Куран-и Керим</title>
<meta name="description" content="Свещеният Коран на арабски с превод на български, рецитатори и времена за намаз за всяко населено място в България.">
<meta name="theme-color" content="#0c2a23" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f1e3" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/UthmanicHafs.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/intro.css">
<script>
  // тема преди първото рисуване, за да няма премигване
  try { const t = JSON.parse(localStorage.getItem('qk:v1') || '{}').theme; if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
  // начален екран (златният мусхаф): само при отваряне на началото, не при директна връзка към айет/намаз
  try { const s = JSON.parse(localStorage.getItem('qk:v1') || '{}'), h = location.hash; if ((s.intro !== false || sessionStorage.qkIntro) && (!h || h === '#' || h === '#/')) document.documentElement.classList.add('intro-on'); } catch (e) {}
</script>
</head>
<body>
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="Куран-и Керим — начален екран">
  <div class="in-pattern"></div><div class="in-rays"></div><div id="inStars"></div>
  <button class="in-skip" id="inSkip" type="button">Пропусни</button>
  <div class="in-stage" id="inStage">
    <div class="in-glow"></div>
    <div class="in-float">
      <div class="book" aria-hidden="true">
        <div class="bk-back"></div>
        <div class="bk-spine"></div>
        <div class="bk-edge l"></div><div class="bk-edge t"></div><div class="bk-edge b"></div>
        <div class="bk-page"><div class="pg-frame"><div class="pg-head">سُورَةُ ٱلْفَاتِحَةِ</div><div class="pg-text" id="inFatiha"></div></div></div>
        <div class="bk-cover">
          <div class="cv-front">
            <svg viewBox="0 0 200 280" preserveAspectRatio="none">
              <defs>
                <g id="cvOrn" fill="none" stroke-linejoin="round">
                  <rect x="7" y="7" width="186" height="266" rx="5" stroke-width="2.2"/>
                  <rect x="13" y="13" width="174" height="254" rx="3" stroke-width=".9"/>
                  <path stroke-width="1.1" d="M13 40a27 27 0 0 0 27-27M187 40a27 27 0 0 1-27-27M13 240a27 27 0 0 1 27 27M187 240a27 27 0 0 0-27 27"/>
                  <path stroke-width="1" d="M13 30a17 17 0 0 0 17-17M187 30a17 17 0 0 1-17-17M13 250a17 17 0 0 1 17 17M187 250a17 17 0 0 0-17 17"/>
                  <rect x="45" y="85" width="110" height="110" stroke-width="1.8"/>
                  <rect x="45" y="85" width="110" height="110" stroke-width="1.8" transform="rotate(45 100 140)"/>
                  <circle cx="100" cy="140" r="52" stroke-width="1.3"/>
                  <circle cx="100" cy="140" r="47" stroke-width=".7"/>
                  <path stroke-width="1.2" d="M100 26c10 8 10 20 0 28-10-8-10-20 0-28zM82 40c8-2 14 0 18 0M118 40c-8-2-14 0-18 0M100 226c10 8 10 20 0 28-10-8-10-20 0-28zM82 240c8 2 14 0 18 0M118 240c-8 2-14 0-18 0"/>
                  <path stroke-width=".8" d="M100 62v9M100 209v9M31 140h9M160 140h9"/>
                  <circle cx="100" cy="40" r="3" stroke-width="1"/><circle cx="100" cy="240" r="3" stroke-width="1"/>
                </g>
              </defs>
              <use href="#cvOrn" stroke="rgba(255,248,215,.85)" transform="translate(-.7 -.7)"/>
              <use href="#cvOrn" stroke="#6b4a12"/>
            </svg>
            <div class="cv-title">القرآن الكريم</div>
          </div>
          <div class="cv-inside"></div>
        </div>
      </div>
      <div class="bk-shadow"></div>
    </div>
  </div>
  <div class="in-bottom">
    <button class="in-bism" id="inBism" type="button"><span class="ar" lang="ar">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</span><small>Бисмилляхир-Рахманир-Рахим</small></button>
    <p class="in-mean">В името на Аллах, Всемилостивия, Милосърдния!</p>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5C7 18 10 18.5 12 20m0-13.5C14 5 17 4.5 20.5 5v13.5C17 18 14 18.5 12 20m0-13.5V20"/></symbol>

    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4.5h3.5v15H7zM13.5 4.5H17v15h-3.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5v14L8 12zM6 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5v14l10-7zM18 5v14"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

    <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>

    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>

    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>

<div class="app">
  <aside class="rail" aria-label="Странична лента">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#logo"/></svg></span>
      <span><b>Куран-и Керим</b><small>القرآن الكريم</small></span>
    </a>
    <nav class="rail-nav" aria-label="Раздели">
      <a href="#/" data-nav="home"><svg class="ic"><use href="#i-book"/></svg>Коран</a>
      <a href="#/prayer" data-nav="prayer"><svg class="ic"><use href="#i-clock"/></svg>Намаз</a>
      <a href="#/bookmarks" data-nav="bookmarks"><svg class="ic"><use href="#i-bookmark"/></svg>Отметки</a>
      <a href="#/settings" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg>Настройки</a>
    </nav>
    <div class="rail-prayer" id="railPrayer"></div>
  </aside>

  <main id="view" tabindex="-1"></main>

  <section class="player" id="player" hidden aria-label="Аудио плейър">
    <div class="player-progress"><i id="plProg"></i></div>
    <div class="player-row">
      <button class="pl-info" id="plInfo" aria-label="Към айета">
        <b id="plTitle">—</b><small id="plSub">—</small>
      </button>
      <div class="pl-ctrls">
        <button class="ib" id="plPrev" aria-label="Предишен айет"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="ib pl-main" id="plPlay" aria-label="Пусни / пауза"><svg class="ic"><use href="#i-play"/></svg><span class="spin"></span></button>
        <button class="ib" id="plNext" aria-label="Следващ айет"><svg class="ic"><use href="#i-next"/></svg></button>
      </div>
      <div class="pl-extra">
        <button class="chip" id="plMode" aria-label="Режим на четене"></button>
        <button class="chip" id="plRate" aria-label="Скорост">1×</button>
        <button class="chip" id="plReciter" aria-label="Рецитатор"><svg class="ic"><use href="#i-mic"/></svg><span></span></button>
        <button class="ib" id="plClose" aria-label="Спри"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </div>
  </section>

  <nav class="tabbar" aria-label="Раздели">
    <a href="#/" data-nav="home"><svg class="ic"><use href="#i-book"/></svg><span>Коран</span></a>
    <a href="#/prayer" data-nav="prayer"><svg class="ic"><use href="#i-clock"/></svg><span>Намаз</span></a>
    <a href="#/bookmarks" data-nav="bookmarks"><svg class="ic"><use href="#i-bookmark"/></svg><span>Отметки</span></a>
    <a href="#/settings" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg><span>Настройки</span></a>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" hidden>
  <div class="sheet-grip"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <path d="M32 4l7.6 10.4L52 12l-2.4 12.4L60 32l-10.4 7.6L52 52l-12.4-2.4L32 60l-7.6-10.4L12 52l2.4-12.4L4 32l10.4-7.6L12 12l12.4 2.4z"/>
      <path d="M22 40c3-1 7-1.5 10 .8 3-2.3 7-1.8 10-.8V24c-3-1-7-1.5-10 .8-3-2.3-7-1.8-10-.8zM32 24.8V40.8"/>
    </g>
  </symbol>
</svg>

<script type="module" src="js/app.js"></script>
</body>
</html>
